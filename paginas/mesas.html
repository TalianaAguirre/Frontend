<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mesas — Restaurante XYZ</title>
    <link rel="stylesheet" href="../css/general.css">
    <link rel="stylesheet" href="../css/mesas.css">
</head>
<body class="interior">

    <nav class="navbar">
        <span class="navbar-marca">Restaurante XYZ</span>
        <div class="navbar-links">
            <a href="mesas.html" class="activo">Mesas</a>
            <a href="reservas.html">Reservas</a>
            <a href="productos.html">Productos</a>
            <a href="pedidos.html">Pedidos</a>
        </div>
        <button class="btn-logout" id="btnLogout">Cerrar sesión</button>
    </nav>

    <main class="pagina-main">

        <div class="pagina-header">
            <h1>Mesas</h1>
            <button class="btn-dorado" id="btnNueva">+ Nueva mesa</button>
        </div>

        <div class="contenido-pagina">

            <form name="mesaForm" class="formulario-interno" id="mesaForm">
                <h2 class="form-titulo">Guardar mesa</h2>
                <div class="campo">
                    <label for="numero">Número de mesa</label>
                    <input type="text" name="numero" id="numero" placeholder="Ej: Mesa 1">
                    <p id="msgNumero" class="inputError">Campo obligatorio</p>
                </div>
                <div class="campo">
                    <label for="capacidad">Capacidad</label>
                    <input type="number" name="capacidad" id="capacidad" placeholder="Ej: 4" min="1">
                    <p id="msgCapacidad" class="inputError">Campo obligatorio</p>
                </div>
                <div class="campo">
                    <label for="estado">Estado</label>
                    <select name="estado" id="estado">
                        <option value="disponible">Disponible</option>
                        <option value="reservada">Reservada</option>
                        <option value="ocupada">Ocupada</option>
                        <option value="fuera_servicio">Fuera de servicio</option>
                    </select>
                </div>
                <div class="botones-form">
                    <button type="submit" class="btn-dorado">Guardar</button>
                    <button type="reset" class="btn-outline">Cancelar</button>
                </div>
            </form>

            <table id="mesasTB">
                <thead>
                    <tr>
                        <th>Número</th>
                        <th>Capacidad</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>

        </div>

    </main>

    <div id="toast" class="toast"></div>

    <script src="../js/mesas.js"></script>
    <script src="../js/mesas_form.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
