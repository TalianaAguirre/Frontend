<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de sesión</title>
    <link rel="stylesheet" href="css/general.css">
    <link rel="stylesheet" href="css/auth.css">
</head>
<body class="login">
    
    <main class="page-content">
        <div class="content">
            <h1>Restaurante XYZ</h1>
            <p class="subtitulo">Inicie sesión para comenzar</p>

            <form name="inicioForm" class="formulario" id="loginform">
                <h2 class="form-titulo">Inicio de sesión</h2>
                <div>
                    <label for="login_user">Correo electrónico o nombre de usuario</label>
                    <input type="text" id="login_user" name="login_user" placeholder="Ej:user o user@correo.com">
                    <p id="msgUsuario" class="inputError">Campo obligatorio</p>
                </div>
                <div>
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" name="contrasena" placeholder="Ingrese su contraseña">
                    <p id="msgContrasena" class="inputError">Campo obligatorio</p>
                </div>
                <div class="botones">
                    <button type="submit" class="btn-dorado">Iniciar sesión</button>
                    <button type="reset" class="btn-outline">Cancelar</button>
                </div>
            </form>
        </div>
    </main>
    <script src="js/auth.js"></script>
</body>
</html>
